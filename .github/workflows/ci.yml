name: CI

on:
  pull_request:
  push:
    paths-ignore:
      - "stock-ledger/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit + check
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (server/api/lib)
        run: npm run check
      - name: Unit tests
        run: mkdir -p test-results && npm run test:unit -- --reporter=default --reporter=junit --outputFile=test-results/unit-junit.xml
      - name: Upload unit JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-junit
          path: test-results/unit-junit.xml
          if-no-files-found: ignore
          retention-days: 7
      - name: Job summary
        if: always()
        run: |
          {
            echo "## Unit + check"
            echo "- tsc (ci) + vitest completed on Node 22"
            echo "- No live PayPal / Sendcloud / Resend calls"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Astro site
        run: npm run build:site
      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist
          retention-days: 3

  e2e:
    name: E2E Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
      - name: Run Playwright
        run: npm run test:e2e
        env:
          CI: true
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  tina-lock:
    name: Tina lock
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regenerate lock and fail on drift
        run: npm run check:tina
      - name: Job summary
        if: always()
        run: |
          {
            echo "## Tina lock"
            echo "- \`tinacms build --local --skip-cloud-checks\` then \`git diff\` on \`tina/tina-lock.json\`"
            echo "- Prevents ERR_CLOUD_CHECK_FAILED on Pages when schema changes without committing the lock"
          } >> "$GITHUB_STEP_SUMMARY"

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm audit (critical)
        run: npm audit --omit=dev --audit-level=critical

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TINA_CLIENT_ID: ${{ secrets.TINA_CLIENT_ID }}
      NEXT_PUBLIC_TINA_CLIENT_ID: ${{ secrets.TINA_CLIENT_ID }}
      TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
      GITHUB_BRANCH: main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build TinaCMS admin
        run: |
          if [ -n "$TINA_CLIENT_ID" ] && [ -n "$TINA_TOKEN" ]; then
            echo "Building Tina admin for TinaCloud (skip gate — Cloud indexes async after push)"
            npx tinacms build --skip-cloud-checks
          else
            echo "WARNING: TINA_CLIENT_ID / TINA_TOKEN secrets missing — building local admin (login online will fail)"
            npx tinacms build --local --skip-cloud-checks
          fi
      - name: Tina admin noindex
        run: |
          node -e "
          const fs = require('fs');
          const p = 'public/admin/index.html';
          if (!fs.existsSync(p)) { console.log('no admin index, skip'); process.exit(0); }
          let html = fs.readFileSync(p, 'utf8');
          const tag = '<meta name=\"robots\" content=\"noindex, nofollow\" />';
          if (!html.includes('noindex')) {
            html = html.replace(/<head[^>]*>/i, (m) => m + tag);
            fs.writeFileSync(p, html);
            console.log('injected robots noindex into admin');
          }
          "
      - run: npx astro build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
      TINA_CLIENT_ID: ${{ secrets.TINA_CLIENT_ID }}
      NEXT_PUBLIC_TINA_CLIENT_ID: ${{ secrets.TINA_CLIENT_ID }}
      TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
      GITHUB_BRANCH: main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build TinaCMS admin
        run: |
          if [ -n "$TINA_CLIENT_ID" ] && [ -n "$TINA_TOKEN" ]; then
            echo "Building Tina admin with TinaCloud (client id present)"
            npx tinacms build
          else
            echo "WARNING: TINA_CLIENT_ID / TINA_TOKEN secrets missing — building local admin (login online will fail)"
            npx tinacms build --local --skip-cloud-checks
          fi
      - run: npx astro build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
